<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" role="img" aria-labelledby="aboutHeroMosaicTitle">
  <title id="aboutHeroMosaicTitle">A flashcard, a quiz screen, and a resume — the three tools IntQues is built around</title>
  <defs>
    <linearGradient id="ahmBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ff8c3a"/>
    </linearGradient>
    <linearGradient id="ahmIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="ahmShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Resume card (back, left) -->
  <g filter="url(#ahmShadow)" transform="rotate(-9 180 250)">
    <rect x="60" y="120" width="200" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="100" cy="160" r="16" fill="#e2e8f0"/>
    <rect x="126" y="152" width="90" height="10" rx="3" fill="#334155"/>
    <rect x="126" y="168" width="60" height="8" rx="3" fill="#94a3b8"/>
    <rect x="84" y="200" width="192" height="7" rx="3" fill="#0f172a" opacity="0.06"/>
    <rect x="84" y="200" width="60" height="7" rx="3" fill="url(#ahmIndigo)"/>
    <rect x="84" y="222" width="176" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="84" y="238" width="150" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="84" y="254" width="164" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="84" y="284" width="60" height="7" rx="3" fill="url(#ahmIndigo)"/>
    <rect x="84" y="306" width="176" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="84" y="322" width="140" height="8" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- Quiz card (middle, right) -->
  <g filter="url(#ahmShadow)" transform="rotate(7 380 220)">
    <rect x="300" y="80" width="210" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="322" y="102" width="80" height="16" rx="8" fill="rgba(255,106,0,0.12)"/>
    <rect x="332" y="107" width="60" height="6" rx="3" fill="#ea580c"/>
    <rect x="322" y="132" width="166" height="10" rx="3" fill="#0f172a"/>
    <rect x="322" y="148" width="140" height="10" rx="3" fill="#0f172a"/>
    <rect x="322" y="178" width="166" height="34" rx="10" fill="#fff7f0" stroke="#ffe0c2" stroke-width="1.5"/>
    <circle cx="340" cy="195" r="8" fill="url(#ahmBrand)"/>
    <rect x="356" y="190" width="110" height="9" rx="3" fill="#7c2d12" opacity="0.55"/>
    <rect x="322" y="220" width="166" height="34" rx="10" fill="#ffffff" stroke="#eef2f7" stroke-width="1.5"/>
    <circle cx="340" cy="237" r="8" fill="#e2e8f0"/>
    <rect x="356" y="232" width="90" height="9" rx="3" fill="#94a3b8"/>
    <rect x="322" y="262" width="166" height="34" rx="10" fill="#ffffff" stroke="#eef2f7" stroke-width="1.5"/>
    <circle cx="340" cy="279" r="8" fill="#e2e8f0"/>
    <rect x="356" y="274" width="120" height="9" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Flashcard (front, center) -->
  <g filter="url(#ahmShadow)">
    <rect x="150" y="200" width="260" height="180" rx="18" fill="url(#ahmBrand)"/>
    <rect x="150" y="200" width="260" height="180" rx="18" fill="#ffffff" opacity="0.02"/>
    <rect x="178" y="228" width="70" height="10" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="178" y="252" width="204" height="12" rx="3" fill="#ffffff"/>
    <rect x="178" y="272" width="160" height="12" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="178" y="322" width="120" height="28" rx="14" fill="#ffffff" opacity="0.18"/>
    <rect x="192" y="332" width="92" height="8" rx="3" fill="#ffffff"/>
    <circle cx="366" cy="336" r="18" fill="#ffffff" opacity="0.16"/>
    <path d="M358 336 l6 6 l12 -14" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
