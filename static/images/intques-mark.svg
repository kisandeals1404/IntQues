<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true">
  <title>IntQues</title>
  <defs>
    <linearGradient id="iqBadge" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8c3a"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#iqBadge)"/>

  <!-- bulb: one bold circle + 3 short rays, no fine linework — reads as a single mass at
       tiny nav sizes (30-36px) instead of dissolving into a blur -->
  <g stroke="#fff" stroke-width="3.2" stroke-linecap="round">
    <line x1="32" y1="9" x2="32" y2="13.5"/>
    <line x1="21.5" y1="13.5" x2="24.7" y2="16.7"/>
    <line x1="42.5" y1="13.5" x2="39.3" y2="16.7"/>
  </g>
  <circle cx="32" cy="25" r="10" fill="#fff"/>

  <!-- open book: single filled silhouette, no internal divider/rule lines, its top edge tucked
       under the bulb so the two shapes read as one connected mark once scaled down -->
  <path d="M10 38
           C10 35.8 14 34.5 19.5 34.5
           C25.5 34.5 30 36.5 32 39
           C34 36.5 38.5 34.5 44.5 34.5
           C50 34.5 54 35.8 54 38
           L54 50
           C54 47.8 50 46.5 44.5 46.5
           C38.5 46.5 34 48.5 32 51
           C30 48.5 25.5 46.5 19.5 46.5
           C14 46.5 10 47.8 10 50
           Z" fill="#fff"/>
</svg>
