<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="bzHeroPreviewTitle">
  <title id="bzHeroPreviewTitle">Placeholder preview of the IntQues Business exam dashboard — replace with a real product screenshot</title>
  <defs>
    <linearGradient id="bzhpBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ff8c3a"/>
    </linearGradient>
    <linearGradient id="bzhpBar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="bzhpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Browser window -->
  <g filter="url(#bzhpShadow)">
    <rect x="16" y="16" width="608" height="428" rx="18" fill="#ffffff"/>
    <rect x="16" y="16" width="608" height="428" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

